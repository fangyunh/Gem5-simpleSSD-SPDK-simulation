#
# fast_ssd_highiops.cfg --- SimpleSSD config for the IEEE CAL paper
#
# Purpose: configure SimpleSSD so the *host* CPU is the binding bottleneck
# across all evaluated IO-Uncore modes (0, 1, 2B). Concretely, the SSD-side
# per-IO service time should fall below the SPDK host-loop time even under
# Mode 2B (~2.0 us/IO).
#
# NVMeVirt-style fast-path timing model adopted (FastPathEnabled = 1).
# The SSD-side SSD pipeline is replaced with an aggregate statistical model
# (per-channel target completion time = max(now, channel_next_free) + Lmin),
# routed through Controller::submit() at target time so all IO-Uncore
# mechanisms (CQE staging, hint register, MSI coalescing) continue to fire.
# This removes the per-stage event chain that capped previous experiments
# at ~168 K IOPS and enables the millions-of-IOPS regime needed for the
# host-bound IO-Uncore evaluation. See PATH_E_FAST_PATH_PLAN.md.
#
# Citations for the timing model:
#   NVMeVirt [Kim et al., USENIX FAST 2023]
#   FEMU     [Li et al.,  USENIX FAST 2018]
#   SwarmIO  [KAIST, arXiv:2604.06668, 2026]
#
# Cycle-accurate gem5 X86 + SPDK host-side modeling is preserved unchanged.
# The IO-Uncore design measures only host-PCIe-boundary behavior, which the
# fast path leaves cycle-accurate.
#
# What we DO target: the host-bound regime that a 10 M-IOPS-class drive
# will operate in. The IO-Uncore figures show host CPU savings (Mode 0 vs
# Mode 1 vs Mode 2B) under this regime; absolute SSD IOPS is *not* the
# claim.
#
# Differences from fast_ssd.cfg (Samsung 970-EVO-class baseline):
#   pal.Channel        8     -> 32     (4x parallel buses)
#   pal.LSBRead        45 us -> 1 us   (XL-FLASH-class array sense)
#   pal.MSBRead        65 us -> 2 us
#   pal.DMASpeed       400   -> 1600   (NV-DDR3 mode 5)
#   pal.DMAWidth       8     -> 16     (16-bit NAND bus)
#   nvme.WorkInterval  1 us  -> 200 ns (5x faster controller dispatch)
#   nvme.MaxRequestCount 8   -> 32
#   nvme.PCIEGeneration  2 (Gen3) -> 4 (Gen5)  -- requires simplessd source
#                                                support (added in this tree)
#   nvme.PCIELane      4     -> 16     (~10 M IOPS PCIe-BW ceiling)
#   nvme.AXIBusWidth   2 (128b) -> 5 (1024b)
#   nvme.AXIClock      250 MHz -> 500 MHz     (combined: ~64 GB/s AXI BW)
#   cpu.ClockSpeed     400 MHz -> 32 GHz (modeling abstraction for fixed-function
#                                         controller logic in a hardware-accelerated
#                                         NVMe device; not a claim about silicon;
#                                         supports >=5 M IOPS controller-CPU ceiling)
#   cpu.{HIL,ICL,FTL}CoreCount  1 (kept; multi-core path has known bugs)
#
# IO-Uncore knobs are PRESERVED (UncoreMode default = 2 / Mode B).
#
# Use:
#   SSD_CFG=fast_ssd_highiops.cfg ./scripts/phase1_4k/driver_phase1.sh --auto ...
# or override via boot_gem5.sh's SSD_CFG environment variable.
#

[cpu]
# Hardware-accelerated NVMe controller (Storage-Next class). We model a
# device whose command-processing path is implemented in fixed-function
# logic rather than firmware on a general-purpose embedded core, so
# per-command processing time is negligible compared to NAND/DMA. To
# approximate this in cycle-accurate simulation, the modeled controller-
# CPU clock is set to 32 GHz: SimpleSSD's per-operation cycle counts
# (simplessd/cpu/cpu.cc:162+ InstStat tables, ~5300 cycles for a 4 KB
# read) translate to ~0.17 µs/IO on the controller-CPU side. Combined
# with AXI 1024-bit @ 500 MHz (~64 GB/s) and PCIe Gen5 x16 (~63 GB/s),
# every storage-side ceiling sits comfortably above 5 M IOPS at 4 KB
# random read, leaving the host CPU as the binding bottleneck across
# single-qpair AND multi-qpair scaling. IOPS-per-mode rows in results
# CSVs measure host throughput, isolating IO-Uncore host-side savings.
#
# Reviewer-facing framing: the 32 GHz value is a *modeling abstraction*
# for fixed-function controller logic, not a claim about real-silicon
# clock speed. Per-operation cycle counts in cpu.cc are unchanged.
#
# HILCoreCount kept at 1 deliberately: SimpleSSD's HIL/NVMe code paths
# (uncorePendingCQE vector, uncoreFlushScheduled flag, aggregationMap,
# lSQFIFO, shutdownReserved) assume single-core dispatch and have
# iterator-invalidation / double-schedule hazards under HILCoreCount > 1.
# See memory/project_simplessd_multicore_audit.md.
#
# ICL and FTL parallelized to 4 cores: the audit flagged only one LOW-risk
# hazard in ICL (cache-LRU eviction non-determinism, no data integrity
# impact) and none in FTL. Adding parallelism in these two stages removes
# them as serialization points behind HIL, lifting the controller's
# command-dispatch ceiling without exposing the HIL multi-core hazards.
ClockSpeed = 32000000000
HILCoreCount = 1
ICLCoreCount = 4
FTLCoreCount = 4

[nvme]

## PCI Express Interface
# Possible values:  0=Gen1.x  1=Gen2.x  2=Gen3.x  3=Gen4.x  4=Gen5.x
# Gen4/5 added in simplessd/util/interface.{hh,cc} + hil/{nvme,sata}/config.cc
# (per-byte delays: Gen3 1000 ps, Gen4 500 ps, Gen5 250 ps; encoding 1.015625
# for Gen3-5).
# PCIe Gen5 x 16 -> ~63 GB/s -> ~10 M IOPS PCIe-BW ceiling at 4 KB.
# x16 is non-physical for SSD form factors but is a deliberate modeling
# abstraction for "abundant interconnect bandwidth"; documented in
# methodology section.
PCIEGeneration = 4
PCIELane = 16

## PCI Express Endpoint <-> NVMe Controller
# AXIBusWidth values: 0=32b 1=64b 2=128b 3=256b 4=512b 5=1024b
# 1024b @ 500 MHz = 64 GB/s sustained; ~15 M IOPS at 4 KB. Matches
# PCIe Gen5 x 16 to keep AXI off the critical path.
AXIBusWidth = 5
AXIClock = 500000000

## Hardware FIFO Transfer unit
FIFOTransferUnit = 2048

## Controller main loop interval. Lowered from 200 ns -> 50 ns to test
## whether work-loop frequency is binding the dispatch rate at 168 K IOPS.
## A 1 us baseline gives 1 M IOPS theoretical dispatch ceiling per loop;
## 50 ns gives 20 M IOPS theoretical, removing this as a candidate
## bottleneck for the host-bound regime experiment.
WorkInterval = 50000

## Maximum # of I/O requests handled per loop iteration. Bumped 32 -> 128
## so the controller can drain a fuller SQ per work() iteration, helping
## at QD >= 64 where 32 was the per-loop cap.
MaxRequestCount = 128

## Set maximum number of I/O queues that the controller supports.
## Bumped 16 -> 64 (2026-05-14) to allow --qpairs up to 64 per core.
## BAR0 layout below was rebalanced accordingly so the mailbox region
## (cqsize*MailboxStride bytes from MailboxBase) does not overlap FreeCIDBase.
MaxIOCQueue = 64
MaxIOSQueue = 64

## Weighted Round-robin
WRRHigh = 2
WRRMedium = 2

DefaultNamespace = 1
LBASize = 512
EnableDiskImage = 0
StrictSizeCheck = 0
DiskImageFile1 = nvme.img
UseCopyOnWriteDisk = 0

## I/O Uncore knobs (PRESERVED from fast_ssd.cfg)
## UncoreMode: 0=disabled, 1=Mode A, 2=Mode B (mailbox SQ Engine + hint reg)
UncoreMode     = 2
CQBatchN       = 8
CQBatchT       = 4000000
DBBatchB       = 4

## Mode 2 deep-offload Mailbox SQ Engine.  Dormant unless UncoreMode = 2 AND
## SPDK is launched with SPDK_UNCORE_MODE_B=1 in the environment.
## Cycle defaults derived from RTL spec §4 (SQ Engine FSM) at 1 GHz:
##   3*latch (3 ns) + decode (8 ns) + inject (4 ns) = 15 ns/IO controller cost
##   vs ~389 ns/IO of SPDK host work elided (PRP + cmd build + doorbell ring).
MailboxBase         = 0x3000
MailboxStride       = 0x20
MailboxLatchCycles  = 1
MailboxDecodeCycles = 8
MailboxInjectCycles = 4

## Mechanism #1/#2: HW free-CID ring + queue-depth counter read endpoints.
##   BAR0 + FreeCIDBase + qid*4         -> read pops next free CID (0xFFFF if empty)
##   BAR0 + FreeCIDBase + 0x400 + qid*4 -> read returns current in-flight count
## Moved 0x3400 -> 0x4000 (2026-05-14) so the mailbox region above
## (MailboxBase + cqsize*MailboxStride; up to 0x3000 + 65*0x20 = 0x3820 at
## MaxIOCQueue=64) does not collide.  The corresponding SPDK macros are at
## spdk/lib/nvme/nvme_pcie_internal.h (FREE_CID_BASE_OFFSET, QDEPTH_BASE_OFFSET).
FreeCIDBase          = 0x4000
FreeCIDLatencyCycles = 2

## Mechanism #4: typed hint register (count:16, oldest-age:16).  1 age-unit =
## HintAgeGranularityPs picoseconds (default 1 us).  SPDK uses the age field
## to decide whether to skip the CQ scan when count==0.
HintAgeGranularityPs = 1024000

## --- Fast-path statistical timing model (NVMeVirt-style) ---
## When FastPathEnabled = 1, the NVMe controller skips the HIL/ICL/FTL/PAL
## per-stage event chain for I/O commands. Each I/O is mapped to a NAND
## channel and assigned a target completion time:
##
##   target_time = max(now, channel_next_free[ch]) + FastPathLmin
##   channel_next_free[ch] = max(now, channel_next_free[ch])
##                         + 1e12 / FastPathTmaxPerChannel
##
## The CQE is then routed through Controller::submit() at target_time,
## which preserves all I/O-Uncore mechanisms (uncorePendingCQE staging,
## uncoreFlushScheduled timeout, BAR0+0x2000 hint register, aggregationMap
## MSI coalescing). Mode 0 / 1 / 2B differentiation is therefore unaffected.
##
## Admin commands (sqID==0) always use the full SimpleSSD pipeline.
##
## Citations: NVMeVirt [Kim FAST '23], FEMU [Li FAST '18],
## SwarmIO [KAIST '26]. Methodology paragraph in PATH_E_FAST_PATH_PLAN.md §7.
##
## Aggregate SSD-side IOPS ceiling = FastPathTmaxPerChannel × [pal] Channel.
## With current values: 1 M × 32 = 32 M IOPS theoretical, well above the
## 5 M evaluation target.
FastPathEnabled        = 1
FastPathLmin           = 1000000     # 1 us; matches LSBRead (XL-FLASH-class)
# 2026-05-15: FastPathTmaxPerChannel lowered 1M -> 250K so the device ceiling
# drops from 32 MIOPS to 8 MIOPS (32 ch x 250K = 8 MIOPS).  Goal: make multi-
# host-core saturation reachable on the simulator (binding shifts from "host
# CPU at ~6-9 cores" to "SSD device at ~5-7 cores under Mode 2 per-core ~1.1M
# IOPS").  pal.Channel stays at 32 so per-channel parallelism is unchanged;
# only the per-channel rate cap is reduced.  Aggregate ceiling = 8 MIOPS.
FastPathTmaxPerChannel = 250000      # 250 K IOPS / channel  (was 1M, 32M aggregate)
FastPathChannelPolicy  = 1           # 0=round-robin, 1=LBA-hash
FastPathMaxOutstanding = 8192        # back-pressure cap; 0 = uncapped

[ufs]
AXIBusWidth = 1
AXIClock = 250000000
MPHYMode = 2
MPHYLane = 2
WorkInterval = 1000000
MaxRequestCount = 8
LBASize = 512
EnableDiskImage = 0
StrictSizeCheck = 0
DiskImageFile = ufs.img
UseCopyOnWriteDisk = 0

[sata]
PCIEGeneration = 2
PCIELane = 4
AXIBusWidth = 2
AXIClock = 250000000
SATAMode = 2
WorkInterval = 1000000
MaxRequestCount = 8
LBASize = 512
EnableDiskImage = 0
StrictSizeCheck = 0
DiskImageFile = sata.img
UseCopyOnWriteDisk = 0

[pal]

## NAND parallelism (4x channels vs baseline)
Channel = 32
Package = 4

## Per-package structure unchanged
Die = 2
Plane = 2
Block = 512
Page = 512
PageSize = 16384

EnableMultiPlaneOperation = 1

## MLC (matches XL-FLASH cell type)
NANDType = 1

## NAND timing (XL-FLASH-class, ps)
LSBRead = 1000000        # 1 us  (was 45 us)
LSBWrite = 50000000      # 50 us (was 500 us)
CSBRead = 0
CSBWrite = 0
MSBRead = 2000000        # 2 us  (was 65 us)
MSBWrite = 100000000     # 100 us (was 1300 us)
Erase = 1000000000       # 1 ms  (was 3.5 ms)

## NAND DMA bus: NV-DDR3 mode 5 at 16-bit width = 3.2 GB/s per channel
DMASpeed = 1600
DMAWidth = 16

SuperblockSize = C
PageAllocation = CWDP

[ftl]
MappingMode = 0
OverProvisioningRatio = 0.25
EraseThreshold = 100000
FillingMode = 0
FillRatio = 0.5
InvalidPageRatio = 0.0
EvictPolicy = 0
DChoiceParam = 3
GCThreshold = 0.05
GCMode = 0
GCReclaimBlocks = 1
GCReclaimThreshold = 0.1
EnableRandomIOTweak = 1

[icl]
# Cache disabled for the random-4KB host-bound experiment. Random reads
# over a multi-GB span hit the cache ~0%, so the cache is a pure overhead
# tax (per-command lookup serialization + eviction churn). Disabling it
# removes ICL as a potential per-command serializer in the binding path.
# Re-enable for sequential or hot-set workloads.
CacheSize = 536870912
CacheWaySize = 8
EnableReadCache = 0
EnableReadPrefetch = 0
ReadPrefetchMode = 1
ReadPrefetchCount = 3
ReadPrefetchRatio = 0.25
EnableWriteCache = 0
EvictPolicy = 2
EvictMode = 1
CacheLatency = 10

[dram]
Model = 0
Channel = 1
Rank = 1
Bank = 8
Chip = 1
BusWidth = 32
BurstLength = 8
ChipSize = 1073741824
PageSize = 4096
